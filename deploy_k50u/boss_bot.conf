; ==============================================================================
; Supervisor 守护进程配置文件: boss_bot.conf
; 适用环境: Redmi K50 Ultra - Debian 12 ARM64 Chroot 容器
; 服务名称: boss_bot
; 功能说明: 使用 Xvfb 虚拟屏幕包裹 Python 运行 DrissionPage + NiceGUI，实现无桌面有头防爬
; ==============================================================================

[program:boss_bot]
; 运行工作目录 (若部署在其他路径，可自行修改或通过 1_setup_debian.sh 自动替换)
directory=/root/boss_auto_greet_k50u

; 核心启动命令:
; 1. /usr/bin/xvfb-run -a: 自动在内存中申请一个未占用的虚拟 X Display (如 :99)
; 2. --server-args="-screen 0 1920x1080x24": 创建 1920x1080 分辨率、24位真彩虚拟显存
; 3. 包裹虚拟环境中的 Python 启动 app.py，让 Chromium 认定处于真实的桌面显示环境，
;    从而彻底规避各大招聘平台针对 Headless Chrome 无头特性的高精度反爬指纹识别
command=/usr/bin/xvfb-run -a --server-args="-screen 0 1920x1080x24" /root/boss_auto_greet_k50u/venv/bin/python /root/boss_auto_greet_k50u/app.py

; 运行权限与自启动设置
user=root
autostart=true
autorestart=true
startsecs=10
startretries=10

; 进程组管理策略 (至关重要):
; 当执行 supervisorctl stop/restart 时，自动将 xvfb 及其衍生的 Chromium 浏览器子进程全部精准回收
; 杜绝僵尸进程常驻与内存泄漏
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15

; 环境变量配置:
; 1. PYTHONUNBUFFERED=1 保证 Python 标准输出实时刷新，日志不滞后
; 2. 强制指定 UTF-8 编码，防止中文职位或 HR 沟通记录乱码
; 3. 指定 HOME 路径，确保 Chromium 正常读取用户目录配置
environment=PYTHONUNBUFFERED="1",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8",HOME="/root"

; 标准输出日志配置
stdout_logfile=/root/boss_auto_greet_k50u/supervisor_stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB

; 标准错误日志配置
stderr_logfile=/root/boss_auto_greet_k50u/supervisor_stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
stderr_capture_maxbytes=1MB
